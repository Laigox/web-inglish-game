<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Present Simple Quest</title>
  <link rel="stylesheet" href="fronted/css/index.css">

</head>
<body>
  <div class="bg-orb bg-orb--one"></div>
  <div class="bg-orb bg-orb--two"></div>

  <main class="app-shell">
    <header class="topbar arcade-header">
      <div>
        <p class="eyebrow">ARCADE MODE</p>
        <h1>Present Simple Quest</h1>
      </div>
      <div class="hud-mini" aria-label="Estado rápido">
        <span><strong id="scoreValue">0</strong>PTS</span>
        <span><strong id="comboValue">x1</strong>COMBO</span>
        <span class="sr-only"><strong id="medalValue">0</strong>MEDALS</span>
      </div>
    </header>

    <section class="hero card arcade-screen">
      <div class="arcade-screen__top">
        <p class="hero-tag">START</p>
        <button class="btn btn-secondary btn-small" id="musicToggle" type="button">🎵</button>
      </div>
      <h2>Rápido, simple y directo.</h2>
      <p class="hero-copy">Elige un modo y entra al reto.</p>
      <div class="hero-actions hero-actions--arcade">
        <button class="btn btn-primary" data-play-entry="true">▶ PLAY</button>
        <button class="btn btn-secondary" data-action="profile">👾 PROFILE</button>
        <button class="btn btn-secondary" data-action="rankings">🏆 TOP</button>
        <button class="btn btn-secondary" data-action="settings">⚙ SET</button>
      </div>
      <div class="progress-bar progress-bar--compact" aria-hidden="true"><span id="progressBar"></span></div>
      <small id="progressLabel">0%</small>
      <p class="unlock" id="unlockLabel">Nivel 1</p>
    </section>

    <div id="feedbackToast" class="feedback-toast" role="status" aria-live="polite" aria-atomic="true"></div>

  </main>

  <button id="musicControl" class="music-control" type="button" aria-label="Silenciar o activar música">🔊</button>
  <audio id="bgMusic" src="media/sounds/arcade-soundtrack.mp3" autoplay loop></audio>

  <script defer src="core/js/app.js"></script>
</body>
</html>
