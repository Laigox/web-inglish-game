<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Present Simple Quest - Game</title>
  <link rel="stylesheet" href="../fronted/css/index.css">
  <link rel="stylesheet" href="../fronted/css/pages/game_interface.css">
  <base href="/web-inglish-game/">
</head>
<body>
  <div class="bg-orb bg-orb--one"></div>
  <div class="bg-orb bg-orb--two"></div>
  <main class="app-shell">
    <header class="topbar arcade-header">
      <div>
        <p class="eyebrow">ARCADE MODE</p>
        <h1>Game Interface</h1>
      </div>
      <div class="hud-mini" aria-label="Estado rápido">
        <span><strong id="scoreValue">0</strong>PTS</span>
        <span><strong id="comboValue">x1</strong>COMBO</span>
        <span class="sr-only"><strong id="medalValue">0</strong>MEDALS</span>
      </div>
    </header>

    <section class="hero card arcade-screen">
      <div class="arcade-screen__top">
        <p class="hero-tag" id="gameModeLabel">PLAY</p>
        <button class="btn btn-secondary btn-small" id="backHomeBtn" type="button">🏠</button>
      </div>
      <div class="game-progress-wrap" aria-label="Progreso de la partida">
        <div class="game-progress">
          <span id="gameProgressBar"></span>
        </div>
        <small id="gameProgressLabel">0 de 10</small>
      </div>
      <div id="gameRoot"></div>
    </section>

    <div id="feedbackToast" class="feedback-toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>

  <button id="musicControl" class="music-control" type="button" aria-label="Silenciar o activar música">🔊</button>
  <audio id="bgMusic" src="../media/sounds/arcade-soundtrack.mp3" autoplay loop></audio>

  <script defer src="../core/js/app.js"></script>
</body>
</html>
